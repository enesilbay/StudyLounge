name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm run test -- --runInBand
        
      - name: Run Backend E2E Tests
        working-directory: ./backend
        run: npm run test:e2e -- --runInBand
        env:
          JWT_SECRET: test-secret

  web-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Run Web Lint
        working-directory: ./web
        run: npm run lint

      - name: Build Web
        working-directory: ./web
        run: npm run build

      - name: Run Web Unit Tests
        working-directory: ./web
        run: npm test

  # Gercek Postgres + backend + web ile Playwright testleri (demo verisiyle).
  web-e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, web-verify]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: studylounge
          POSTGRES_PASSWORD: studylounge
          POSTGRES_DB: studylounge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studylounge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: studylounge
      DB_PASSWORD: studylounge
      DB_NAME: studylounge
      JWT_SECRET: e2e-secret
      PORT: '3000'
      # Gelistirme modu semayi entity'lerden kurar; testler kisa surede cok giris yapar.
      NODE_ENV: development
      THROTTLE_DISABLED: 'true'
      VITE_BACKEND_URL: http://127.0.0.1:3000
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build and Start Backend
        working-directory: ./backend
        run: |
          npm run build
          nohup node dist/main > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/health && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/health || (cat backend.log; exit 1)

      - name: Seed Demo Data
        working-directory: ./backend
        run: npm run seed

      - name: Install Playwright Browser
        working-directory: ./web
        run: npx playwright install --with-deps chromium

      - name: Run Web E2E Tests
        working-directory: ./web
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            backend/backend.log
          retention-days: 7

  mobile-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Run Mobile Typecheck
        working-directory: ./mobile
        run: npm run typecheck

      - name: Run Mobile Lint
        working-directory: ./mobile
        run: npm run lint
