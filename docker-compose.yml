version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: studylounge_db
    restart: always
    environment:
      POSTGRES_USER: enes_admin
      POSTGRES_PASSWORD: studylounge_secret
      POSTGRES_DB: studylounge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
